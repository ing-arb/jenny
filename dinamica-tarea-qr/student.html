<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>El chisme de la tarea</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#172033}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,#35105c,#ec4899 55%,#ffb703)}
.shell{width:min(620px,100%);position:relative}.glow{position:absolute;inset:-18px;border-radius:36px;background:rgba(255,255,255,.3);filter:blur(12px)}
.card{position:relative;background:rgba(255,255,255,.96);border-radius:32px;padding:30px;box-shadow:0 24px 70px #25033c66;overflow:hidden}
.content{position:relative;z-index:1}.hero{display:flex;align-items:center;gap:14px}.hero-badge{width:74px;height:74px;border-radius:24px;background:linear-gradient(135deg,#ff006e,#8338ec);display:grid;place-items:center;color:#fff;font-size:36px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:rotate(7deg) translateY(-5px)}}h1{font-size:33px;line-height:1.03;margin:0;color:#32104f}.sub{margin:6px 0;color:#5d4770;line-height:1.45;font-size:17px}
.ribbon{display:inline-flex;padding:10px 14px;border-radius:999px;background:#fff0f7;color:#d20a61;font-weight:800;margin:18px 0 8px}label{display:block;font-weight:800;margin:14px 0 8px;color:#32104f}
.inputrow{display:grid;grid-template-columns:1fr auto;gap:10px}input{width:100%;font-size:18px;padding:16px 18px;border:2px solid #ead6ed;border-radius:16px;outline:0}input:focus{border-color:#ec4899;box-shadow:0 0 0 4px #ec489922}
button{border:0;border-radius:16px;background:linear-gradient(135deg,#ec4899,#7c3aed);color:#fff;font-size:18px;font-weight:800;cursor:pointer;padding:16px 18px;min-width:175px;box-shadow:0 12px 26px #b5177550}button:hover{transform:translateY(-1px)}
#result{display:none;margin-top:20px;padding:22px;border-radius:24px;animation:pop .28s ease-out}@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.ok{background:#ecfdf3;border:1px solid #86efac}.pending{background:#fff7ed;border:1px solid #fdba74}.unknown{background:#f8fafc;border:1px solid #cbd5e1}.big{font-size:42px;margin-bottom:8px}.name{font-weight:900;font-size:23px;color:#32104f}.result-title{font-size:28px;margin:8px 0;color:#32104f}.result-text{line-height:1.55;color:#334155;font-size:18px;margin:0}.bullets{margin:14px 0 0;padding-left:20px;color:#41516d}.bullets li{margin:6px 0}.note{font-size:13px;color:#6b7280;text-align:center;margin-top:16px}.footline{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}.token{background:#fff0f7;color:#bd145f;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:800}
@media(max-width:560px){.card{padding:22px}.inputrow{grid-template-columns:1fr}button{width:100%}h1{font-size:28px}}
</style>
</head>
<body><main class="shell"><div class="glow"></div><section class="card"><div class="content">
<div class="hero"><div class="hero-badge">👀</div><div><h1>El chisme de la tarea</h1><p class="sub">Escribe tu nombre completo y mira qué dice el reporte secreto.</p></div></div>
<div class="ribbon">🤫 Resultado privado</div><label for="name">Tu nombre completo</label><div class="inputrow"><input id="name" autocomplete="name" placeholder="Escribe tu nombre completo"><button id="check">Ver chisme 😏</button></div>
<section id="result"></section><div class="note">Tu mensaje aparece solo en este dispositivo ✨</div>
</div></section></main>
<script>
const input=document.getElementById('name'),btn=document.getElementById('check'),result=document.getElementById('result');
const ok=[['🎉✨','¡Chisme confirmado!','Tu tarea aparece cumplida. Tu responsabilidad ya es tema de conversación.',['Cumpliste con la actividad.','Tu esfuerzo quedó registrado.','Sigue con ese ritmo.']],['🏆😏','¡Se sabía que podías!','Tu nombre aparece entre quienes cumplieron. Hoy el aplauso es para ti.',['Mostraste compromiso.','Tu trabajo cuenta.','Mantén esa actitud.']],['✅👀','¡Misión cumplida!','La tarea está registrada como entregada. El reporte habla bien de tu esfuerzo.',['Respondiste a tiempo.','Avanzaste con responsabilidad.','Continúa así.']],['👏💫','¡Muy bien hecho!','Tu tarea quedó lista y tu esfuerzo merece una felicitación especial.',['Asumiste tu compromiso.','Demostraste constancia.','Sigue trabajando así.']]];
const pending=[['📚⏳','Chisme pendiente','Tu tarea aún aparece pendiente. Todavía puedes cambiar el reporte.',['Revisa la actividad.','Complétala con cuidado.','Entrégala para mejorar tu resultado.']],['😕📝','Aún falta algo','Por ahora tu tarea no aparece como cumplida. Confío en que puedes ponerte al día.',['Organiza tu tiempo.','Busca apoyo si lo necesitas.','Todavía puedes mejorar.']],['🚨📖','Pendiente por resolver','El reporte dice pendiente, pero la historia puede cambiar con tu esfuerzo.',['No te detengas.','Completa la tarea.','Tu esfuerzo de hoy cuenta.']],['💡⌛','Todavía puedes lograrlo','Esta vez no aparece registrada como cumplida. Aprovecha la oportunidad.',['Haz la actividad.','Entrégala lo antes posible.','Cambia ese resultado con acciones.']]];
function normalize(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ')}
async function hashName(s){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(normalize(s)));return Array.from(new Uint8Array(d)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function pick(name,list){let h=0;for(const c of normalize(name))h=(h*31+c.charCodeAt(0))>>>0;return list[h%list.length]}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function show(name,status){const t=pick(name,status==='cumplio'?ok:pending);result.className=status==='cumplio'?'ok':'pending';result.style.display='block';result.innerHTML='<div class="big">'+t[0]+'</div><div class="name">'+esc(name)+'</div><h2 class="result-title">'+t[1]+'</h2><p class="result-text">'+t[2]+'</p><ul class="bullets">'+t[3].map(x=>'<li>'+x+'</li>').join('')+'</ul><div class="footline"><span class="token">'+(status==='cumplio'?'Resultado confirmado':'Aún puedes cambiarlo')+'</span><span class="token">'+(status==='cumplio'?'Buen trabajo':'No te rindas')+'</span></div>'}
async function check(){const name=input.value.trim();if(!name){input.focus();return}btn.disabled=true;btn.textContent='Buscando...';try{const [key,r]=await Promise.all([hashName(name),fetch('./status-map.json?v='+Date.now(),{cache:'no-store'})]);const map=await r.json();if(map[key])show(name,map[key]);else{result.className='unknown';result.style.display='block';result.innerHTML='<div class="big">🤔</div><div class="name">No encuentro tu nombre</div><h2 class="result-title">Revisa la escritura</h2><p class="result-text">Escríbelo completo, revisa tus apellidos e inténtalo otra vez.</p>'}}catch(e){result.className='unknown';result.style.display='block';result.innerHTML='<div class="big">⚠️</div><p class="result-text">No se pudo consultar el resultado. Intenta nuevamente.</p>'}finally{btn.disabled=false;btn.textContent='Ver chisme 😏'}}
btn.addEventListener('click',check);input.addEventListener('keydown',e=>{if(e.key==='Enter')check()});
</script></body></html>
