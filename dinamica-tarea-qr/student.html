<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tu mensaje</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;font-family:Arial,sans-serif;color:#241033;background:linear-gradient(135deg,#210038,#a900a8 52%,#ff477e)}.card{width:min(510px,100%);background:#fff;border-radius:32px;padding:30px;box-shadow:0 25px 70px #15002088;text-align:center}.top{font-size:58px;animation:bob 2.5s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px) rotate(6deg)}}h1{font-size:34px;margin:8px 0;color:#4e0870}p{color:#6f5a7d;font-size:18px;line-height:1.4}label{display:block;text-align:left;margin:24px 0 8px;font-weight:800;color:#3d1551}input{width:100%;padding:16px;border:2px solid #ead5ef;border-radius:16px;font-size:18px;outline:0}input:focus{border-color:#d3289b;box-shadow:0 0 0 4px #d3289b22}button{width:100%;margin-top:12px;padding:16px;border:0;border-radius:16px;background:linear-gradient(135deg,#ec218d,#7b24d4);color:#fff;font-size:18px;font-weight:900;cursor:pointer}button:disabled{opacity:.65}#result{display:none;margin-top:22px;padding:22px;border-radius:22px;font-size:22px;font-weight:800;line-height:1.35}.card.done{padding:34px}.card.done>*:not(#result){display:none}.card.done #result{margin:0;min-height:240px;display:grid;place-items:center;font-size:29px}.ok{background:#e9fff2;color:#08733d;border:1px solid #8be7b1}.pending{background:#fff5e9;color:#a84d00;border:1px solid #ffc27d}.unknown{background:#f5f2f7;color:#5d4d66;border:1px solid #d9cddd}.small{font-size:13px;color:#8b7b92;margin-top:16px}@media(max-width:520px){.card{padding:24px}h1{font-size:29px}}
</style>
</head>
<body><main class="card" id="card"><div class="top">🤫</div><h1>Tu mensaje secreto</h1><p>Escribe tu nombre completo.</p><label for="name">Nombre completo</label><input id="name" autocomplete="name" placeholder="Escribe tu nombre"><button id="check">Descubrir 😏</button><section id="result"></section><div class="small">✨ Tu mensaje aparecerá aquí ✨</div></main>
<script>
const input=document.getElementById('name'),button=document.getElementById('check'),result=document.getElementById('result'),card=document.getElementById('card');
function normalize(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ')}
async function hashName(s){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(normalize(s)));return Array.from(new Uint8Array(d)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function check(){const name=input.value.trim();if(!name){input.focus();return}button.disabled=true;button.textContent='Buscando...';try{const [key,r]=await Promise.all([hashName(name),fetch('./status-map.json?v='+Date.now(),{cache:'no-store'})]);const status=(await r.json())[key];card.classList.add('done');result.style.display='block';if(status==='cumplio'){result.className='ok';result.innerHTML='😄🎉<br>¡Chisme confirmado!<br>Completaste tu tarea. ¡Sigue así, máquina!'}else if(status==='pendiente'){result.className='pending';result.innerHTML='😢📚<br>¡Ups! El chisme dice pendiente.<br>Corre a completarla y cambia el final 😎'}else{result.className='unknown';result.innerHTML='🤔<br>Ese nombre se escondió.<br>Revísalo e inténtalo otra vez.'}}catch(e){card.classList.add('done');result.className='unknown';result.style.display='block';result.innerHTML='😵<br>El chisme se trabó.<br>Intenta otra vez.'}finally{button.disabled=false;button.textContent='Descubrir 😏'}}
button.addEventListener('click',check);input.addEventListener('keydown',e=>{if(e.key==='Enter')check()});
</script></body>
</html>
