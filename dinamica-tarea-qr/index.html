<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>El chisme</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;font-family:Arial,sans-serif;color:#fff;background:linear-gradient(135deg,#16002e,#7900a8 48%,#ff2d75)}
.bubble{position:fixed;border-radius:50%;filter:blur(2px);opacity:.35;animation:float 7s ease-in-out infinite}.b1{width:260px;height:260px;left:-70px;top:-60px;background:#00e5ff}.b2{width:330px;height:330px;right:-100px;bottom:-110px;background:#ffcf33;animation-delay:-3s}.b3{width:130px;height:130px;right:19%;top:12%;background:#ff65bf;animation-delay:-1s}
@keyframes float{50%{transform:translateY(-18px) scale(1.08)}}.wrap{width:min(980px,92vw);display:grid;grid-template-columns:1fr 390px;gap:48px;align-items:center;position:relative;z-index:1}
.copy{padding:20px}.eyebrow{font-size:22px;font-weight:800;letter-spacing:.5px}.emoji{font-size:58px;display:inline-block;animation:wink 2.8s ease-in-out infinite}@keyframes wink{50%{transform:rotate(-8deg) scale(1.08)}}
h1{font-size:clamp(58px,8vw,106px);line-height:.9;margin:12px 0 18px;letter-spacing:-4px}.hint{font-size:clamp(22px,3vw,32px);line-height:1.15;margin:0;max-width:570px}
.qr-card{background:#fff;color:#27113d;border-radius:32px;padding:22px;box-shadow:0 24px 70px #12002188;text-align:center;transform:rotate(1deg)}.tag{display:inline-block;padding:10px 16px;border-radius:99px;background:#ffe3f1;color:#c00064;font-weight:900}.qr-box{margin:18px auto 12px;padding:18px;border-radius:24px;background:#fff;box-shadow:0 10px 35px #4b126622}.qr-box img{display:block;width:100%;height:auto}.qr-card strong{font-size:22px;color:#6d007c}.spark{font-size:27px;letter-spacing:8px;margin-top:10px}
@media(max-width:780px){body{overflow:auto}.wrap{grid-template-columns:1fr;gap:18px;padding:30px 0}.copy{text-align:center;padding:0}.hint{margin:auto}.qr-card{width:min(390px,100%);margin:auto}h1{letter-spacing:-2px}}
</style>
</head>
<body>
<div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>
<main class="wrap">
<section class="copy"><div class="emoji">👀</div><div class="eyebrow">Pssst... 🤫</div><h1>¿Ya te enteraste?</h1><p class="hint">Hay un chisme esperando por ti.</p></section>
<aside class="qr-card"><div class="tag">✨ Mensaje secreto</div><div class="qr-box"><img id="qr" alt="Código QR"></div><strong>Escanea y descubre 😏</strong><div class="spark">✨ 👀 ✨</div></aside>
</main>
<script>
const studentUrl=new URL('student.html',location.href).href;
document.getElementById('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=8&data='+encodeURIComponent(studentUrl);
</script>
</body>
</html>
