<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dinámica QR de tarea</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at top,#3158c9,#14245b 58%,#09102e);color:#fff;display:grid;place-items:center;padding:24px}.wrap{width:min(1180px,96vw);display:grid;grid-template-columns:1.35fr .65fr;gap:36px;align-items:center}h1{font-size:clamp(44px,6vw,86px);line-height:1.02;margin:0 0 18px}.sub{font-size:clamp(22px,2.5vw,34px);opacity:.94;line-height:1.35}.hint{margin-top:30px;display:inline-block;background:rgba(255,255,255,.12);padding:14px 18px;border-radius:16px;font-size:20px}.qrbox{background:#fff;padding:24px;border-radius:30px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.28)}.qrbox img{width:min(340px,70vw);height:auto;display:block;margin:auto}.qrbox p{color:#172033;font-weight:800;margin:14px 0 0;font-size:18px;word-break:break-word}.qrbox small{display:block;margin-top:8px;color:#64748b}@media(max-width:820px){.wrap{grid-template-columns:1fr;text-align:center}.qrbox{width:min(430px,100%);margin:auto}}
</style>
</head>
<body>
<div class="wrap">
<section>
<div style="font-size:58px">👀 🔐</div>
<h1>Hay un mensaje oculto para ti...</h1>
<div class="sub">¿Te atreves a descubrirlo?<br>Escanea el QR y escribe tu nombre.</div>
<div class="hint">Solo tú verás tu resultado.</div>
</section>
<aside class="qrbox">
<img id="qr" alt="Código QR">
<p id="url"></p>
<small>Escanea con la cámara de tu celular.</small>
</aside>
</div>
<script>
const studentUrl='https://ing-arb.github.io/jenny/dinamica-tarea-qr/student.html';
document.getElementById('url').textContent=studentUrl;
document.getElementById('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=420x420&margin=10&data='+encodeURIComponent(studentUrl);
</script>
</body>
</html>
